<form [formGroup]="frmInformacion" >
    <br>
    <div class="row"> 

        <div class="col-sm-4">
            <mat-form-field class="caja_tipo"  appearance="outline">
                <mat-label>TIPO</mat-label>
                <input   matInput readonly  formControlName="strTipo" >
            </mat-form-field>
        </div>
    
        <div class="col-sm-4">
            <mat-form-field class="caja_expediente"  appearance="outline">
                <mat-label>EXPEDIENTE</mat-label>
                <input   matInput readonly  formControlName="strExpediente" >
            </mat-form-field>
            
        </div>
    
        <div class="col-sm-4">
            <mat-form-field  class="caja_documento"  appearance="outline">
                <mat-label>DOCUMENTO</mat-label>
                <input   matInput readonly  formControlName="strDocumento" >
            </mat-form-field>
        </div>
    
        </div>
    
    <div class="row">
    <div class="col-sm-12">
        <mat-form-field class="caja_descripcion"   appearance="outline">
            <mat-label>DESCRIPCION</mat-label>
            <input   matInput readonly  formControlName="strProceso" >
        </mat-form-field>
    </div>
    </div>
     
    <div class="row" style="width: 100%;height: 500px;">
     
        <mat-tab-group>
            <mat-tab label="HOGARES">
               <app-hogares [codigoRevaluacion]="pidrevaluacion"></app-hogares>
            </mat-tab>
            <mat-tab label="MIEMBROS OBJETIVOS">
               <app-mobjetivos [codigoRevaluacion]="pidrevaluacion"></app-mobjetivos>
            </mat-tab> 
        </mat-tab-group>
    </div>
    
    <div class="rows text-center">
        <button mat-fab extended class="boton_general" (click)="onCancel()">
            <mat-icon>closet</mat-icon>CERRAR
        </button>
    </div>
    
   
</form>
