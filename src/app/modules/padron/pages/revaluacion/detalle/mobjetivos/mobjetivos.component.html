<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
 
    
    <!-- Position Column -->
  <ng-container matColumnDef="CODIGOHOGAR">
    <th mat-header-cell *matHeaderCellDef> CODIGO HOGAR</th>
    <td mat-cell *matCellDef="let element"> {{element.codigoHogar}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="IDHOGAR">
    <th mat-header-cell *matHeaderCellDef> IDHOGAR </th>
    <td mat-cell *matCellDef="let element"> {{element.idHogar}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="PERIODO">
    <th mat-header-cell *matHeaderCellDef> PERIODO </th>
    <td mat-cell *matCellDef="let element"> {{element.codigoPeriodo}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="IDCORTE">
    <th mat-header-cell *matHeaderCellDef> IDCORTE </th>
    <td mat-cell *matCellDef="let element"> {{element.codigoCorte}} </td>
  </ng-container>

  <ng-container matColumnDef="MIEMBRO_OBJETIVO">
    <th mat-header-cell *matHeaderCellDef> MIEMBRO OBJETIVO </th>
    <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
  </ng-container>

  <ng-container matColumnDef="CUMPLIO_MES_1">
    <th mat-header-cell *matHeaderCellDef> MES 1</th>
    <td mat-cell *matCellDef="let element"> {{element.mes_1}} </td>
  </ng-container>

  <ng-container matColumnDef="CUMPLIO_MES_2">
    <th mat-header-cell *matHeaderCellDef> MES 2</th>
    <td mat-cell *matCellDef="let element"> {{element.mes_2}} </td>
  </ng-container>


  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10,14]"
showFirstLastButtons
aria-label="Select page of periodic elements">
</mat-paginator>
