<div class="rows text-center">
  
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    
      <!-- Weight Column -->
      <ng-container matColumnDef="DEPARTAMENTO">
        <th mat-header-cell *matHeaderCellDef > DEPARTAMENTO </th>
        <td mat-cell *matCellDef="let element" [matTooltip]="element.provincia+' || '+element.distrito+' || '+element.centroPoblado"> {{element.departamento}} </td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="ESQUEMA">
        <th mat-header-cell *matHeaderCellDef > ESQUEMA </th>
        <td mat-cell *matCellDef="let element"> {{element.esquema}} </td>
      </ng-container>
    
      <!-- Weight Column -->
      <ng-container matColumnDef="CODIGOPADRON">
        <th mat-header-cell *matHeaderCellDef > CODIGOPADRON </th>
        <td mat-cell *matCellDef="let element"> {{element.codigoPadronPago}} </td>
      </ng-container>
    
      <!-- Weight Column -->
      <ng-container matColumnDef="PERIODO">
        <th mat-header-cell *matHeaderCellDef> PERIODO </th>
        <td mat-cell *matCellDef="let element"> {{element.periodo}} </td>
      </ng-container>
    
      <!-- Weight Column -->
      <ng-container matColumnDef="IDHOGAR">
        <th mat-header-cell *matHeaderCellDef > IDHOGAR</th>
        <td mat-cell *matCellDef="let element"> {{element.idhogar}} </td>
      </ng-container>
    
      <!-- Weight Column -->
      <ng-container matColumnDef="MONTO">
        <th mat-header-cell *matHeaderCellDef > MONTO S/</th>
        <td mat-cell *matCellDef="let element"> {{element.monto}} </td>
      </ng-container>
    
      <!-- Weight Column -->
      <ng-container matColumnDef="TITULAR">
        <th mat-header-cell *matHeaderCellDef > TITULAR </th>
        <td mat-cell *matCellDef="let element"> {{element.titular}} </td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="OBSERVACION">
        <th mat-header-cell *matHeaderCellDef > OBSERVACION </th>
        <td mat-cell *matCellDef="let element"> {{element.observacion}} </td>
      </ng-container>
    
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table> 
    
    <mat-paginator [pageSizeOptions]="[10,14]"
        showFirstLastButtons
        aria-label="Select page of periodic elements">
    </mat-paginator>
