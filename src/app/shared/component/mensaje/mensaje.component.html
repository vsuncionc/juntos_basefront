<h2 mat-dialog-title [ngStyle]="{'text-align': 'center', 'color': colorTitulo,'font-weight': 'bold'}">{{titulo}}</h2>
<mat-dialog-content style="text-align: center;">
    <h6>{{mensaje}}</h6>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
